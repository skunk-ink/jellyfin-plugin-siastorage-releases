name: Feedback or idea
description: Something confusing, missing, or that could be better.
labels: ["feedback", "alpha"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What you were trying to do, and what would have made it easier.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: 0.1.0.0
